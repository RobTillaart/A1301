name: Compile Examples
# https://github.com/arduino/compile-sketches

on: [push, pull_request]

jobs:
  runTest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: arduino/compile-sketches@v1
      with:
        fqbn: "arduino:avr:uno"
        libraries: |
          - name: A1301
        verbose: true

