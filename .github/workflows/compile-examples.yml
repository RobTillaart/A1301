name: Compile Examples
# https://github.com/arduino/compile-sketches

on: [push, pull_request]

jobs:
  run_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: arduino/compile-sketches@v1
      with:
        fqbn: "arduino:avr:uno"
        sketch-paths: |
          - ./examples
        # libraries: |
          # - name: A1301
        verbose: true

