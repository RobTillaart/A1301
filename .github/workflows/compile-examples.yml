name: Compile Examples
# https://github.com/arduino/compile-sketches

on: [push, pull_request]

jobs:
  runTest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: arduino/compile-sketches@v1
      with:
        fqbn: "arduino:avr:uno"
        sketch-paths: |
          - ./examples/A1301_demo
        libraries: |
          - name: A1301
        verbose: true

