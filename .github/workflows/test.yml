name: test

on: [push, pull_request]

jobs:
  runTest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: |
         curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
         ls -al bin
         bin/arduino-cli config init > /dev/null
         bin/arduino-cli core update-index > /dev/null
         echo "step 2"
         bin/arduino-cli core install arduino:avr
         bin/arduino-cli compile ../examples/A1301_plotter
         
         

